name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build plain binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/switcher-server_${VERSION}_${os}_${arch}" .
          done
          cd dist
          for f in switcher-server_*; do
            shasum -a 256 "$f" | tee "$f.sha256"
          done

      - name: Build macOS app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Switcher.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp build/macos/logos/*.png "$APP/Contents/Resources/"
          sed "s/VERSION_TOKEN/${VERSION}/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
          GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "$APP/Contents/MacOS/SwitcherServer" .
          swiftc -O -o "$APP/Contents/MacOS/Switcher" build/macos/menubar.swift
          # Ad-hoc signing: without it Apple Silicon reports quarantined
          # builds as "damaged".
          codesign --force --deep -s - "$APP"

      - name: Package drag-to-Applications DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="build/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/Switcher.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname "Switcher $VERSION" -srcfolder "$STAGE" \
              -ov -format UDZO "dist/Switcher_${VERSION}.dmg" && break
            echo "hdiutil attempt $attempt failed; retrying in 5s"
            sleep 5
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
