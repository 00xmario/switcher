name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify
        run: make verify

      - name: Build plain binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # The optional "Away from home" Tailscale add-on, downloaded by the
          # app only when a user turns it on. Its digest is built into the
          # matching Switcher binary, which trusts nothing else.
          for arch in arm64 amd64; do
            (cd cmd/switcher-tailnet && CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "../../dist/switcher-tailnet_${VERSION}_darwin_${arch}" .)
            sum=$(shasum -a 256 "dist/switcher-tailnet_${VERSION}_darwin_${arch}" | cut -d' ' -f1)
            echo "ADDON_SHA256_${arch}=${sum}" >> "$GITHUB_ENV"
            eval "ADDON_SHA256_${arch}=${sum}"
          done
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            addon=""
            if [ "$os" = darwin ]; then
              eval "addon=\${ADDON_SHA256_${arch}}"
            fi
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${addon}" \
              -o "dist/switcher-server_${VERSION}_${os}_${arch}" .
          done
          cd dist
          for f in switcher-server_* switcher-tailnet_*; do
            shasum -a 256 "$f" | tee "$f.sha256"
          done

      - name: Build macOS app bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Switcher.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp build/macos/logos/*.svg web/logo.svg "$APP/Contents/Resources/"
          cp THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/ThirdPartyNotices.md"
          sed "s/VERSION_TOKEN/${VERSION}/g" build/macos/Info.plist > "$APP/Contents/Info.plist"
          GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X switcher/internal/remote.addonSHA256=${ADDON_SHA256_arm64}" \
            -o "$APP/Contents/MacOS/SwitcherServer" .
          swiftc -parse-as-library -O -o "$APP/Contents/MacOS/Switcher" build/macos/menubar.swift
          # Ad-hoc signing: without it Apple Silicon reports quarantined
          # builds as "damaged".
          codesign --force --deep -s - "$APP"

      - name: Package drag-to-Applications DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="build/dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "build/Switcher.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname "Switcher $VERSION" -srcfolder "$STAGE" \
              -ov -format UDZO "dist/Switcher_${VERSION}.dmg" && break
            if [ "$attempt" -eq 3 ]; then
              echo "hdiutil failed after 3 attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt $attempt failed; retrying in 5s"
            sleep 5
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
