<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock Switcher</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <defs>
            <linearGradient id="brand-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22332b"/><stop offset="1" stop-color="#0a120e"/></linearGradient>
            <linearGradient id="brand-track" gradientUnits="userSpaceOnUse" x1="30" y1="22" x2="62" y2="80"><stop offset="0" stop-color="#d4f76e"/><stop offset=".5" stop-color="#43dc8d"/><stop offset="1" stop-color="#10a89a"/></linearGradient>
            <mask id="brand-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><circle cx="68" cy="28" r="13.4" fill="#000"/></mask>
          </defs>
          <rect width="48" height="48" rx="11" fill="url(#brand-bg)"/>
          <rect x=".5" y=".5" width="47" height="47" rx="10.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
          <g transform="translate(24 24) scale(.5) translate(-52.9 -47.1)">
            <path d="M68 28H44A11 11 0 0 0 44 50H56A11 11 0 0 1 56 72H32" fill="none" stroke="url(#brand-track)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" mask="url(#brand-cut)"/>
            <circle cx="68" cy="28" r="11" fill="#f4fff8"/>
          </g>
        </svg>
      </span>
      <h1 id="login-title">Switcher is locked</h1>
      <p>Enter your password to continue.</p>
      <form id="login-form">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required autofocus>
        <button type="submit" id="login-submit">Unlock Switcher</button>
        <p id="login-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
