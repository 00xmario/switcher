<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switcher</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect width="48" height="48" rx="11" fill="currentColor"/>
            <g stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M13.5 19.5h21"/>
              <path d="M29.5 14.5l5 5-5 5"/>
              <path d="M34.5 28.5h-21"/>
              <path d="M18.5 23.5l-5 5 5 5"/>
            </g>
          </svg>
        </span>
        <h1>Switcher</h1>
      </div>
      <div class="top-actions">
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button data-theme-choice="light" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.4L17 6.8M7 17l-1.4 1.4"/></svg>
          </button>
          <button data-theme-choice="system" title="System theme" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20.5h6"/></svg>
          </button>
          <button data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 19.5 15a8 8 0 0 0 .5-1.5z"/></svg>
          </button>
        </div>
        <span id="add-provider-slot"></span>
        <button id="hub-button" type="button" title="Use Switcher as a CLIProxyAPI hub in T3 Code">Hub</button>
      </div>
    </header>

    <div id="update-slot"></div>

    <nav class="page-tabs" aria-label="Pages">
      <button id="tab-accounts" class="page-tab active" type="button">Accounts</button>
      <button id="tab-usage" class="page-tab" type="button">Usage</button>
    </nav>

    <section id="providers" aria-live="polite"></section>

    <section id="usage-page" hidden>
      <div class="usage-head">
        <p class="usage-crumb">Usage <span class="crumb-sep">/</span> All providers</p>
        <div class="usage-controls">
          <div class="usage-metric" role="radiogroup" aria-label="Metric">
            <button data-usage-metric="cost" class="active" type="button">Cost</button>
            <button data-usage-metric="tokens" type="button">Tokens</button>
          </div>
          <div class="usage-window" role="radiogroup" aria-label="Window">
            <button data-usage-days="1" type="button">Today</button>
            <button data-usage-days="7" type="button">7 days</button>
            <button data-usage-days="30" class="active" type="button">30 days</button>
            <button data-usage-days="90" type="button">90 days</button>
          </div>
          <button id="usage-refresh" type="button" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/></svg>
          </button>
        </div>
      </div>

      <div class="usage-grid">
        <div class="usage-summary">
          <p class="usage-headline" id="usage-headline">$0.00</p>
          <p class="usage-sub" id="usage-sub"></p>
          <div class="usage-providers" id="usage-providers"></div>
        </div>
        <div class="usage-chart">
          <p class="usage-chart-title" id="usage-chart-title">Daily cost</p>
          <div class="usage-chart-box" id="usage-chart"></div>
        </div>
      </div>

      <div class="usage-totals usage-totals-wide" id="usage-totals"></div>

      <div class="usage-breakdown">
        <div class="usage-breakdown-head">
          <h2>Breakdown</h2>
          <div class="usage-mode" role="radiogroup" aria-label="Group by">
            <button data-usage-mode="model" class="active" type="button">Model</button>
            <button data-usage-mode="day" type="button">Day</button>
          </div>
        </div>
        <div id="usage-breakdown-table"></div>
      </div>
    </section>

    <footer class="footnote">
      <p>Switcher forwards your CLI traffic to the account marked <em>Active</em>.
      Switching happens only when you switch, or when the active account runs out of usage.</p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
