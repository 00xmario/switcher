<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switcher</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect width="48" height="48" rx="13"/>
            <g stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
              <path d="M13 17.5h16"/>
              <path d="M24 11.5l6.5 6-6.5 6"/>
              <path d="M35 30.5H19"/>
              <path d="M24 36.5l-6.5-6 6.5-6"/>
            </g>
          </svg>
        </span>
        <h1>Switcher</h1>
      </div>
      <div class="top-actions">
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button data-theme-choice="light" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.4L17 6.8M7 17l-1.4 1.4"/></svg>
          </button>
          <button data-theme-choice="system" title="System theme" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20.5h6"/></svg>
          </button>
          <button data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 19.5 15a8 8 0 0 0 .5-1.5z"/></svg>
          </button>
        </div>
        <button id="add-account" class="btn" type="button">Add Codex account</button>
      </div>
    </header>

    <section id="providers" aria-live="polite"></section>

    <footer class="footnote">
      <p>Switcher forwards your CLI traffic to the account marked <em>Active</em>.
      Switching happens only when you switch, or when the active account runs out of usage.</p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
